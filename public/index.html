<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Architecture Diagrams</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      padding: 2rem;
    }
    h1 {
      font-size: 1.75rem;
      margin-bottom: 1.5rem;
      color: #f0f6fc;
    }
    .diagram-list {
      display: grid;
      gap: 1rem;
      max-width: 600px;
    }
    .diagram-link {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 1.25rem;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #58a6ff;
      text-decoration: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .diagram-link:hover {
      background: #1c2128;
      border-color: #58a6ff;
    }
    .diagram-link svg {
      flex-shrink: 0;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-content {
      position: relative;
      max-width: 95vw;
      max-height: 95vh;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 1rem;
      overflow: auto;
    }
    .modal-content img {
      max-width: 100%;
      height: auto;
      display: block;
    }
    .modal-close {
      position: absolute;
      top: 0.5rem;
      right: 0.75rem;
      background: none;
      border: none;
      color: #8b949e;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
    }
    .modal-close:hover {
      color: #f0f6fc;
      background: #30363d;
    }
    .modal-title {
      font-size: 0.875rem;
      color: #8b949e;
      margin-bottom: 0.75rem;
      padding-right: 2rem;
    }
  </style>
</head>
<body>
  <h1>Architecture Diagrams</h1>
  <div class="diagram-list" id="diagram-list"></div>

  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <button class="modal-close" id="modal-close">&times;</button>
      <p class="modal-title" id="modal-title"></p>
      <img id="modal-img" src="" alt="" />
    </div>
  </div>

  <script>
    const diagrams = [
      'chat.svg'
    ];

    const list = document.getElementById('diagram-list');
    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modal-img');
    const modalTitle = document.getElementById('modal-title');
    const modalClose = document.getElementById('modal-close');

    diagrams.forEach(name => {
      const a = document.createElement('a');
      a.href = '#';
      a.className = 'diagram-link';
      a.innerHTML = `
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        ${name}
      `;
      a.addEventListener('click', e => {
        e.preventDefault();
        modalImg.src = '/' + name;
        modalImg.alt = name;
        modalTitle.textContent = name;
        modal.classList.add('active');
      });
      list.appendChild(a);
    });

    modalClose.addEventListener('click', () => modal.classList.remove('active'));
    modal.addEventListener('click', e => {
      if (e.target === modal) modal.classList.remove('active');
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') modal.classList.remove('active');
    });
  </script>
</body>
</html>

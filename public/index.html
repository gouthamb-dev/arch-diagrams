<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Architecture Diagrams</title>
  <style>
    :root {
      --bg: #FFF8F0;
      --surface: #F5EDDF;
      --surface-high: #EFE7DA;
      --border: #D0C6AF;
      --border-strong: #0B0B0D;
      --text-primary: #1E1B13;
      --text-secondary: #4D4635;
      --accent: #E8C44A;
      --on-accent: #231B00;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0B0B0D;
        --surface: #19191D;
        --surface-high: #212126;
        --border: #3A3D45;
        --border-strong: #D8B8B6;
        --text-primary: #F0ECE0;
        --text-secondary: #C8C2B4;
        --accent: #E8C44A;
        --on-accent: #231B00;
      }
    }
    @font-face {
      font-family: 'Bricolage Grotesque';
      src: url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&display=swap');
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 48px 24px;
    }
    h1 {
      font-size: 39.06px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.01em;
      margin-bottom: 24px;
    }
    .diagram-list {
      display: grid;
      gap: 16px;
      max-width: 600px;
    }
    .diagram-link {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      color: var(--text-primary);
      text-decoration: none;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.6;
      transition: border-color 0.2s;
    }
    .diagram-link:hover {
      border-color: var(--accent);
    }
    .diagram-link svg {
      flex-shrink: 0;
      color: var(--accent);
    }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 32px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-content {
      position: relative;
      max-width: 95vw;
      max-height: 95vh;
      background: var(--surface-high);
      border: 1px solid var(--border);
      border-radius: 32px;
      padding: 24px;
      overflow: auto;
    }
    .modal-content img {
      max-width: 100%;
      height: auto;
      display: block;
    }
    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: var(--accent);
      border: none;
      color: var(--on-accent);
      font-size: 1.25rem;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 12px;
      border-radius: 16px;
    }
    .modal-close:hover {
      opacity: 0.9;
    }
    .modal-title {
      font-size: 12.8px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 16px;
      padding-right: 48px;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <h1>Architecture Diagrams</h1>
  <div class="diagram-list" id="diagram-list"></div>

  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <button class="modal-close" id="modal-close">&times;</button>
      <p class="modal-title" id="modal-title"></p>
      <img id="modal-img" src="" alt="" />
    </div>
  </div>

  <script>
    const diagrams = [
      { file: 'antarticjourney.svg', name: 'Antarticjourney' },
      { file: 'chat.svg', name: 'Chat' },
      { file: 'docs.svg', name: 'Docs' },
      { file: 'recoveryloop.svg', name: 'Recoveryloop' },
      { file: 'trace.svg', name: 'Trace' }
    ];

    const list = document.getElementById('diagram-list');
    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modal-img');
    const modalTitle = document.getElementById('modal-title');
    const modalClose = document.getElementById('modal-close');

    diagrams.forEach(diagram => {
      const a = document.createElement('a');
      a.href = '#';
      a.className = 'diagram-link';
      a.innerHTML = `
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        ${diagram.name}
      `;
      a.addEventListener('click', e => {
        e.preventDefault();
        modalImg.src = '/' + diagram.file;
        modalImg.alt = diagram.name;
        modalTitle.textContent = diagram.name;
        modal.classList.add('active');
      });
      list.appendChild(a);
    });

    modalClose.addEventListener('click', () => modal.classList.remove('active'));
    modal.addEventListener('click', e => {
      if (e.target === modal) modal.classList.remove('active');
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') modal.classList.remove('active');
    });
  </script>
</body>
</html>
